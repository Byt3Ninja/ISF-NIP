# For more information: https://laravel.com/docs/sail
version: '3'
services:
    app:
        build: .
        image: incubator
        container_name: incubator-app
        volumes:
            - '.:/var/www/html'
            - './docker_volumes/php/local.ini:/usr/local/etc/php/conf.d/local.ini'
            - './vendor:/var/www/html/vendor'
        # ports:
        #     - "8000:8000"
        networks:
            - incubator
        depends_on:
            - db
    
    nginx:
        image: nginx:1.21.0
        container_name: incubator-nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www/html
            - ./docker_volumes/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - incubator
        # depends_on:
        #     - app
    
    db:
        image: 'mariadb:10.1'
        container_name: incubator-mariadb
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            # MYSQL_ROOT_USER: 'root'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - './docker_volumes/db:/var/lib/mysql'
        networks:
            - incubator
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
          retries: 3
          timeout: 5s


    phpmyadmin:
         image: phpmyadmin/phpmyadmin:5.1.1
         container_name: incubator-pma
         links:
             - db
         environment:
             PMA_HOST: db
             PMA_PORT: '${FORWARD_PMA_PORT:-3306}'
             PMA_ARBITRARY: 1
         restart: always
         ports:
             - '${FORWARD_PMA_PORT:-8084}:80'
         networks:
             - incubator

networks:
    incubator:
        driver: bridge
