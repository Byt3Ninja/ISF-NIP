# Confidential uploads — add inside the site's `server { }` block.
#
# 1. Old public URLs must reach the application (which requires login and checks the
#    file's record) instead of being answered, or 404'd, by a static-file location.
#    Once `files:protect:retire` has run the files are no longer in these folders.
location ~ ^/(pitch_decks|documents|formsubmissions)/ {
    try_files /__never__ /index.php?$query_string;
}
location ~ ^/storage/(milestones|employees|employee_documents|tasks/attachments)/ {
    try_files /__never__ /index.php?$query_string;
}
location ~* ^/(191014/)?programs/[^/]+\.(pdf|docx?|xlsx?|pptx?|csv|txt)$ {
    try_files /__never__ /index.php?$query_string;
}

# 2. Delivery of the private files. `internal` means a browser can never request this
#    path; only a response from the application (X-Accel-Redirect) is served from it.
#    The alias must be the value of PROTECTED_FILES_ROOT, with a trailing slash.
location /_protected/ {
    internal;
    alias /var/www/html/incubator/storage/protected/;
}
