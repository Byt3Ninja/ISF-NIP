[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:apache]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queued mail, notifications, imports and exports.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --timeout=300 --sleep=3 --max-time=3600
user=www-data
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs the schedule in app/Console/Kernel.php (reminders, phase changes, clean-ups).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
