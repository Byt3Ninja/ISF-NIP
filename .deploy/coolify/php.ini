; Pitch decks, documents and imports are uploaded through the browser.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 512M
max_execution_time = 120
expose_php = Off

; Code only changes when the image is rebuilt.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
