server {
    listen 443 ssl;
    server_name test.growthlabs.app;

    root /var/www/html/public;
    index index.php index.html index.htm;


    ssl_certificate    /etc/nginx/conf.d/ssl/fullchain.pem;
    ssl_certificate_key    /etc/nginx/conf.d/ssl/privkey.pem;
    include /etc/nginx/conf.d/ssl/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/nginx/conf.d/ssl/ssl-dhparams.pem; # managed by Certbot

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        # proxy_pass http://app:8000;
        # proxy_redirect off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;  # Assuming PHP-FPM is running in a container named "php"
        # fastcgi_pass unix:/run/php/php8.0-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}