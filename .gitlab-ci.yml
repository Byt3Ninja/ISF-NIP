stages:
  - beta
  - demo
  - production



beta:
  stage: beta
  image: ubuntu:latest
  allow_failure: true
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$beta_ssh_key")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 700 ~/.ssh
    - ssh-keyscan -p22 18.135.16.249 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p22 -o StrictHostKeyChecking=no ubuntu@18.135.16.249 "cd /home/app/incubator && sudo git pull && sudo docker-compose build && sudo docker-compose up -d && sudo docker-compose exec -T app bash -c 'composer install'"

  only:
    - development


production:
  stage: production
  image: ubuntu:latest
  allow_failure: true
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$arweqah_ssh_key")
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p22 15.237.250.67 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p22 -o StrictHostKeyChecking=no ubuntu@15.237.250.67 "cd /home/app/incubator && sudo git pull && sudo docker-compose build && sudo docker-compose up -d && sudo docker-compose exec -T app bash -c 'composer install'"

  only:
    - production