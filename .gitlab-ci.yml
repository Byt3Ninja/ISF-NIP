stages:
  - beta
  - dev
  - testing

.default_before_script: &default_before_script
  - apt-get update -y && apt-get install -y openssh-client
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  - ssh-add <(echo "$TESTING_SSH_KEY")
  - ssh-keyscan -p22 185.250.36.20 >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts

beta:
  stage: beta
  image: ubuntu:latest
  before_script: *default_before_script
  script:
    - >
      ssh -p22 root@185.250.36.20 "
        cd /var/www/beta &&
        git pull &&

        sed -i \"s/^APP_VERSION=.*/APP_VERSION=$(cat version.txt)/\" .env || echo \"APP_VERSION=$(cat version.txt)\" >> .env &&
        sed -i \"s/^APP_BUILD=.*/APP_BUILD=$CI_PIPELINE_IID/\" .env || echo \"APP_BUILD=$CI_PIPELINE_IID\" >> .env &&
        sed -i \"s/^APP_GIT_SHA=.*/APP_GIT_SHA=$CI_COMMIT_SHORT_SHA/\" .env || echo \"APP_GIT_SHA=$CI_COMMIT_SHORT_SHA\" >> .env &&

        chown -R www-data:www-data storage bootstrap/cache &&
        runuser -u www-data -- php artisan migrate --force &&
        runuser -u www-data -- php artisan db:seed --class=defaultRolesPermissionSeeder
      "
  only:
    - beta

testing:
  stage: testing
  image: ubuntu:latest
  before_script: *default_before_script
  script:
    - >
      ssh -p22 root@185.250.36.20 "
        cd /var/www/test &&
        git pull &&

        sed -i \"s/^APP_VERSION=.*/APP_VERSION=$(cat version.txt)/\" .env || echo \"APP_VERSION=$(cat version.txt)\" >> .env &&
        sed -i \"s/^APP_BUILD=.*/APP_BUILD=$CI_PIPELINE_IID/\" .env || echo \"APP_BUILD=$CI_PIPELINE_IID\" >> .env &&
        sed -i \"s/^APP_GIT_SHA=.*/APP_GIT_SHA=$CI_COMMIT_SHORT_SHA/\" .env || echo \"APP_GIT_SHA=$CI_COMMIT_SHORT_SHA\" >> .env &&

        chown -R www-data:www-data storage bootstrap/cache &&
        runuser -u www-data -- php artisan migrate --force &&
        runuser -u www-data -- php artisan db:seed --class=defaultRolesPermissionSeeder
      "
  only:
    - testing

dev:
  stage: dev
  image: ubuntu:latest
  before_script: *default_before_script
  script:
    - >
      ssh -p22 root@185.250.36.20 "
        cd /var/www/dev &&
        git pull &&

        sed -i \"s/^APP_VERSION=.*/APP_VERSION=$(cat version.txt)/\" .env || echo \"APP_VERSION=$(cat version.txt)\" >> .env &&
        sed -i \"s/^APP_BUILD=.*/APP_BUILD=$CI_PIPELINE_IID/\" .env || echo \"APP_BUILD=$CI_PIPELINE_IID\" >> .env &&
        sed -i \"s/^APP_GIT_SHA=.*/APP_GIT_SHA=$CI_COMMIT_SHORT_SHA/\" .env || echo \"APP_GIT_SHA=$CI_COMMIT_SHORT_SHA\" >> .env &&

        chown -R www-data:www-data storage bootstrap/cache &&
        runuser -u www-data -- php artisan migrate --force &&
        runuser -u www-data -- php artisan db:seed --class=defaultRolesPermissionSeeder
      "
  only:
    - dev
