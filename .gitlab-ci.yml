stages:
  - beta
  - production



beta:
  stage: beta
  image: ubuntu:latest
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
#    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh-client )'
    - eval $(ssh-agent -s)
#    - echo "${beta_private_key}" | tr -d '\r' | ssh-add -
    - ssh-add <(echo "$arweqah_ssh_key")
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p22 15.237.250.67 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    #- ssh -p22 -o StrictHostKeyChecking=no ubuntu@15.237.250.67 "cd /home/app"
    - ssh -p22 -o StrictHostKeyChecking=no ubuntu@15.237.250.67 "cd /home/app/incubator && sudo git pull && sudo docker-compose build && sudo docker-compose up -d && sudo docker-compose exec app bash -c 'composer install'"


  only:
    - development


production:
  stage: production
  image: alpine
  allow_failure: true
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh-client )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_CLOUD" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p 22 15.237.250.67 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p 22 ubuntu@15.237.250.67 'cd /home/app/;sudo sh deploy.sh'

  only:
    - production