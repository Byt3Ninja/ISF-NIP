stages:
  - dev

dev:
  stage: dev
  image: ubuntu:latest
  allow_failure: true
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$dev_ssh_key")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 700 ~/.ssh
    - ssh-keyscan -p22 54.91.31.114 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p22 -o StrictHostKeyChecking=no ubuntu@54.91.31.114 "cd /home/app/incubator && sudo git pull && docker exec incubator-app php artisan migrate --force"

  only:
    - dev