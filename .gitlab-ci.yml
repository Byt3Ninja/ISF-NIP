stages:
  - beta
  - dev

beta:
  stage: beta
  image: ubuntu:latest
  allow_failure: true
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$beta_ssh_key")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 700 ~/.ssh
    - ssh-keyscan -p22 13.38.47.66 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p22 -o StrictHostKeyChecking=no ubuntu@13.38.47.66 "cd /home/ubuntu/app/incubator && git pull && sudo docker exec incubator-app php artisan migrate --force"
  only:
    - beta


dev:
    stage: dev
    image: ubuntu:latest
    allow_failure: true
    before_script:
      - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
      - eval $(ssh-agent -s)
      - ssh-add <(echo "$dev_ssh_key")
      - mkdir -p ~/.ssh
      - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
      - chmod 700 ~/.ssh
      - ssh-keyscan -p22 161.97.152.83 >> ~/.ssh/known_hosts
      - chmod 644 ~/.ssh/known_hosts
    script:
      - ssh -p22 -o StrictHostKeyChecking=no root@161.97.152.83 "cd /home/app/incubator && git pull && docker exec incubator-app php artisan migrate --force"

    only:
      - dev