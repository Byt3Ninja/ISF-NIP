name: Deploy legacy servers

# Ports the old GitLab CI pipeline (.gitlab-ci.yml, removed when the project
# moved to GitHub) that deployed the beta / test / dev servers over SSH.
# These are the "legacy" servers at 185.250.36.20; new environments run on
# Coolify (see .deploy/coolify/).
#
# Required repository secret (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY  private SSH key authorised for root@185.250.36.20
#
# A push to beta / testing / dev deploys the matching server. Those branches do
# not exist yet; until they do, the push trigger stays dormant and you can
# deploy any of the three from the "Run workflow" button (workflow_dispatch).

on:
  push:
    branches: [beta, testing, dev]
  workflow_dispatch:
    inputs:
      target:
        description: Legacy server to deploy
        required: true
        type: choice
        options: [beta, testing, dev]

# No GITHUB_TOKEN is used; keep the default permissions minimal.
permissions:
  contents: read

# One deploy per server at a time; never cancel one midway.
concurrency:
  group: deploy-legacy-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 185.250.36.20
      DEPLOY_PORT: "22"
      DEPLOY_USER: root
    steps:
      - name: Resolve target server
        id: resolve
        run: |
          set -euo pipefail
          branch="${{ github.event.inputs.target || github.ref_name }}"
          case "$branch" in
            beta)    dir=/var/www/beta ;;
            testing) dir=/var/www/test ;;
            dev)     dir=/var/www/dev ;;
            *) echo "::error::Unsupported branch '$branch' - expected beta, testing or dev"; exit 1 ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Deploying '$branch' to $dir on $DEPLOY_HOST"

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ steps.resolve.outputs.dir }}
          APP_BUILD: ${{ github.run_number }}
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY is not set. Add the deploy private key in Settings > Secrets and variables > Actions."
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          short_sha="$(printf '%s' "$GITHUB_SHA_FULL" | cut -c1-8)"

          # Runner-side values ($DEPLOY_DIR, $APP_BUILD, $short_sha) are expanded
          # here; version.txt is read on the server after the pull (\$(...) is
          # escaped so it runs remotely). Same steps the GitLab pipeline ran,
          # with db:seed given --force for a non-interactive shell.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e &&
            cd $DEPLOY_DIR &&
            git pull &&
            sed -i \"s/^APP_VERSION=.*/APP_VERSION=\$(cat version.txt)/\" .env || echo \"APP_VERSION=\$(cat version.txt)\" >> .env &&
            sed -i \"s/^APP_BUILD=.*/APP_BUILD=$APP_BUILD/\" .env || echo \"APP_BUILD=$APP_BUILD\" >> .env &&
            sed -i \"s/^APP_GIT_SHA=.*/APP_GIT_SHA=$short_sha/\" .env || echo \"APP_GIT_SHA=$short_sha\" >> .env &&
            chown -R www-data:www-data storage bootstrap/cache &&
            runuser -u www-data -- php artisan migrate --force &&
            runuser -u www-data -- php artisan db:seed --class=defaultRolesPermissionSeeder --force
          "
          echo "Deployed $DEPLOY_DIR (build $APP_BUILD, $short_sha)."
